# Copy to .github/workflows/supabase-backup.yml in a private repository.
name: supabase-backup

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily, off the hour
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: reeve-page/supabase-backup-action@v1
        with:
          db-url: ${{ secrets.SUPABASE_DB_URL }}
