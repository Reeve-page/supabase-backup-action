# Copy to .github/workflows/supabase-backup.yml in a PRIVATE repository.
name: supabase-backup

on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC, off the hour on purpose
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: OWNER/supabase-backup-action@v1
        with:
          db-url: ${{ secrets.SUPABASE_DB_URL }}
